# Gloss defaults. To change a setting, copy just that key into %APPDATA%/Gloss/config.toml.
# Do not edit this file for personal settings.

config_version = 1

[capture]
mode = "region"              # monitor | region | window
fps_max = 4                  # the only frame-rate knob; passed to every capture adapter
region = []                  # last chosen area [x, y, w, h] in desktop pixels; [] = none yet
tile_size = 64               # change-detection tile, in pixels
black_frame_reads = 8        # near-black frames in a row before a trial grab from the next source
black_frame_max_mean = 4.0   # a frame's mean brightness (0-255) at or below this counts as black

# Each capture mode has its own source and fallbacks.
[capture.sources.monitor]
source = "mss"
fallbacks = ["wgc"]

[capture.sources.region]
source = "mss"
fallbacks = ["wgc"]

[capture.sources.window]
source = "wgc"
fallbacks = ["mss"]

# Adapter tables are passed to the adapter as they are; each adapter checks its own keys.
# Shared values (capture.fps_max here) are passed in too. Do not repeat them in these tables.
[capture.adapters.mss]
# Nothing of its own: mss grabs on demand, so it has no first-frame wait.

[capture.adapters.wgc]
first_frame_timeout_ms = 1500  # how long to wait for Windows to deliver the first frame (0-60000)

[ocr]
engine = "rapidocr"
fallbacks = []               # Empty on purpose. See ADR-0001 section 2.
low_quality_engine = "windows"  # used when the user turns on low-quality reading from the tray;
                                # never an automatic fallback
profile = "fast"             # fast (v6 small) | accurate (v6 medium, needs more RAM)
languages = ["zh", "en", "ja"]
min_confidence = 0.5         # the benchmarked value; 0.6 is not yet proven safe
stable_reads = 2             # unchanged pixels on the next frame count as a read
dedupe_window_s = 30.0
dedupe_max_lines = 2000      # recent lines remembered for de-duplication (memory limit)

# Shared values (ocr.languages, ocr.profile, ocr.min_confidence) are passed to the engine.
[ocr.adapters.rapidocr]
det_limit_type = "max"       # the library's default, "min", broke small crops
det_limit_side_len = 960     # shrink only crops wider or taller than this. See ADR-0005.
max_side_len = 2000          # largest image side the engine accepts (256-8192)
intra_op_threads = 2
inter_op_threads = 1
use_cls = false              # rotated-text classifier; needs an extra model file
region_margin_px = 16        # extra pixels read around each changed area (0-256)
model_dir = ""               # "" = the gitignored models/rapidocr folder (or the app bundle)
skip_translation_langs = []  # OCR languages never sent for translation; the text tracker
                             # already skips translate.target_lang, so leave this empty
upscale = 1.0                # enlarge small crops by this factor (1.0-4.0); 1.0 = never
upscale_below_px = 0         # ... only crops shorter than this many pixels
invert_dark = false          # flip light-on-dark text to dark-on-light before reading
dark_luma = 90.0             # mean brightness (0-255) below which a crop counts as dark

[ocr.adapters.rapidocr.profiles.fast]
ocr_version = "PP-OCRv6"
model_type = "small"

[ocr.adapters.rapidocr.profiles.accurate]
ocr_version = "PP-OCRv6"
model_type = "medium"

[ocr.adapters.windows]
# Registered, but never an automatic fallback.
region_margin_px = 16
skip_translation_langs = []
upscale = 1.0
upscale_below_px = 0
invert_dark = false

[translate]
provider = "anthropic"
fallbacks = ["null"]         # Add "quickmt" before "null" if the offline pack is installed.
target_lang = "en"
batch_max_lines = 20
batch_max_wait_ms = 200
context_lines = 10
redact_digit_runs = 8        # redact runs of this many digits or more before sending

[translate.budget]
monthly_usd = 10.0           # a local estimate; the Anthropic console limit is the only hard stop
hourly_usd = 0.5
warn_at = 0.8                # warn in the tray at this share of the monthly budget

# US dollars per million tokens. Check against the provider's pricing page when changing.
[translate.prices.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

[translate.prices.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read = 0.10
cache_write = 2.50

[translate.adapters.anthropic]
model = "claude-haiku-5-5"   # checked against the models API at startup
thinking = "disabled"        # confirmed by spike 1; changing it needs no code
effort = "low"
secret_name = "anthropic"    # keyring entry: service gloss/anthropic, username api_key
max_tokens_base = 256        # max_tokens = base + per_line x lines
max_tokens_per_line = 80
cache_ttl = "5m"

[translate.adapters.quickmt]
pack_dir = ""                # Set by the offline pack's install step.
idle_unload_s = 300
threads = 4
beam_size = 2

[translate.adapters.null]

[render]
mode = "panel"               # panel | overlay | both
font_size = 14

# Shared value render.font_size is passed to both renderers. A bad value here is ignored
# and the renderer uses its built-in default, so the panel always opens.
[render.adapters.panel]
width = 420                  # first-run size in pixels; after that the saved size is used
height = 560
history_max = 500            # lines kept in the list
max_chars = 1000             # longer lines are cut with "..."
original_scale = 0.75        # original text size as a share of font_size (0.3-1.0)
state_file = ""              # "" = %APPDATA%/Gloss/ui_state.ini (window position and size)

[render.adapters.overlay]
topmost_reassert_ms = 2000
max_width_ratio = 0.5        # widest a label may be, as a share of the screen width
linger_s = 0                 # seconds a label stays after its text leaves; 0 = remove at once

[hotkeys]
toggle = "ctrl+alt+t"
select_region = "ctrl+alt+r"
pause = "ctrl+alt+p"

[reliability]
capture_timeout_ms = 2000
ocr_timeout_ms = 30000       # long enough for a dense page on the accurate profile
translate_timeout_ms = 8000
render_timeout_ms = 1000
queue_size = 2
retry_max = 2
retry_base_delay_ms = 250
retry_max_delay_ms = 4000
breaker_failures = 3         # failures in a row before the circuit opens
breaker_cooldown_s = 300

[privacy]
cloud_translation = true     # false keeps all text on this PC
image_mode = false           # true would send screenshots to the provider
debug_logging = false        # true may write chat text to logs

[storage]
database = "gloss.sqlite3"   # translation cache and spend records, inside %APPDATA%/Gloss
glossary_path = "docs/glossary/zh_gaming.yaml"
cache_max_entries = 50000    # translation cache rows kept; the oldest-used are dropped first
